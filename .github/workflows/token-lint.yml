name: token-lint

on:
  push:
    branches: [main]
    paths: ['*.html', 'atlas/index.html', 'notes/*.html', 'assets/site-header.*', 'scripts/sync-navigation.js', 'site-content.js', 'tokens.json', 'token-exceptions.json']
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check shared navigation
        run: node scripts/sync-navigation.js --check
      - name: Token lint
        run: node scripts/check-tokens.js .
